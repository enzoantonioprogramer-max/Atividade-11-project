<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro</title>
  </head>
  <body>
    <h1>Cadastro</h1>
    <h3>Por favor preencha o seu cadastro com atenção</h3>
    <hr />
    <form  action="./home.html" onsubmit="alert('Seu cadastro foi concluído com sucesso')">
      <p>Nome </p>
      <input placeholder="Preencher nome" required type="text">
      <hr>
      <p>Data de nascimento</p>
      <input placeholder="Preencher a data de nascimento" required type="date">
      <hr>
      <p>Cor favorita</p>
      <input placeholder="Sua cor favorita" required type="text">
      <hr>
      <p>Residência/endereço</p>
      <input placeholder="Seu tipo de Residência e o endereço" required type="text">
      <hr>
      <p>Email</p>
      <input placeholder="Seu email" required type="email">
      <hr>
      <p>Senha</p>
      <input placeholder="Sua senha" required type="password">
      <hr>
      <button type="submit">Salvar</button>
    </form>
    <hr>
   

    

  </body>
</html>
